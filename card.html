<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Card Editor | Magic Stash</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <header class="border-bottom">
        <div class="container py-3">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html">
                    <img src="images/mtg.png" alt="Magic Stash Logo" width="70" height="70">
                </a>
                <div>
                    <h1 class="h4 mb-0">Magic Stash</h1>
                    <p class="small text-body-secondary mb-0">Card & Deck Inventory</p>
                </div>
            </div>
        </div>
    </header>


    <!-- MAIN -->
    <main class="container py-5 flex-grow-1">

        <div class="mb-4">
            <h2 class="mb-1">Card Editor</h2>
            <p class="text-body-secondary mb-0">Add a card to your collection.</p>
        </div>

        <div class="row g-5">

            <div class="col-md-5 col-lg-4">
                <button class="btn btn-outline-secondary w-100" type="button"
                    data-bs-toggle="modal" data-bs-target="#imageModal">
                    Choose Image
                </button>
            </div>

            <div class="col-md-7 col-lg-8">
                <div class="card">
                    <div class="card-body p-4">

                        <div class="mb-3">
                            <label class="form-label">Card Name</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Card Colors</label>

                            <div class="border p-3">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="white">
                                    <label class="form-check-label" for="white">White</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="blue">
                                    <label class="form-check-label" for="blue">Blue</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="black">
                                    <label class="form-check-label" for="black">Black</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="red">
                                    <label class="form-check-label" for="red">Red</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="green">
                                    <label class="form-check-label" for="green">Green</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="colorless">
                                    <label class="form-check-label" for="colorless">Colorless</label>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Card Type</label>
                                <select class="form-select">
                                    <option selected>Select type</option>
                                    <option>Creature</option>
                                    <option>Artifact</option>
                                    <option>Enchantment</option>
                                    <option>Instant</option>
                                    <option>Sorcery</option>
                                    <option>Land</option>
                                    <option>Planeswalker</option>
                                    <option>Battle</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Supertype</label>
                                <select class="form-select">
                                    <option selected>None</option>
                                    <option>Legendary</option>
                                    <option>Basic</option>
                                    <option>Snow</option>
                                    <option>World</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Series</label>
                                <select class="form-select">
                                    <option selected>Select series</option>
                                    <option>Foundations</option>
                                    <option>Dominaria United</option>
                                    <option>Modern Horizons 3</option>
                                    <option>Commander Masters</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Finish</label>
                                <select class="form-select">
                                    <option selected>Nonfoil</option>
                                    <option>Foil</option>
                                    <option>Etched</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Quantity Owned</label>
                                <input type="number" class="form-control" value="1" min="1">
                            </div>

                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="index.html" class="btn btn-outline-secondary">Cancel</a>
                            <button class="btn btn-primary" type="button"
                                data-bs-toggle="modal" data-bs-target="#savedModal">
                                Add Card
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-4">
        <div class="container">
            <div class="d-flex align-items-center gap-3">
                <img src="images/mtgword.png" alt="Magic Stash Logo" class="footer-logo">
                <span class="h5 mb-0 fw-semibold">Magic Stash</span>
            </div>
        </div>
    </footer>

    <!-- IMAGE MODAL -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5">Choose Card Image</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label class="form-label">Upload Image</label>
                    <input type="file" class="form-control">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-primary"
                        data-bs-dismiss="modal">
                        Choose Image
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SAVED MODAL -->
    <div class="modal fade" id="savedModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5">Card Saved</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    The card has been added to your collection.
                </div>

                <div class="modal-footer">
                    <a href="index.html" class="btn btn-primary">Done</a>
                </div>
            </div>
        </div>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
