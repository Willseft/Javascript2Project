<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deck Viewer | Magic Stash</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="app" class="d-flex flex-column min-vh-100">

        <!-- HEADER -->
        <header class="border-bottom">
            <div class="container py-3">

                <div class="d-flex align-items-center gap-3">

                    <a href="index.html">
                        <img
                            src="images/mtg.png"
                            alt="Magic Stash Logo"
                            width="70"
                            height="70">
                    </a>

                    <div>
                        <h1 class="h4 mb-0">Magic Stash</h1>
                        <p class="small text-body-secondary mb-0">
                            Card & Deck Inventory
                        </p>
                    </div>

                </div>

            </div>
        </header>


        <!-- MAIN -->
        <main class="container py-5 flex-grow-1">

            <deck-details
                v-if="selectedDeck"
                :deck="selectedDeck"
                :cards="selectedDeckCards">
            </deck-details>

            <p
                v-else
                class="text-body-secondary">
                Deck not found.
            </p>

        </main>


        <!-- FOOTER -->
        <footer class="py-4">

            <div class="container">

                <div class="d-flex align-items-center gap-3">

                    <img
                        src="images/mtgword.png"
                        alt="Magic Stash Logo"
                        class="footer-logo">

                    <span class="h5 mb-0 fw-semibold">
                        Magic Stash
                    </span>

                </div>

            </div>

        </footer>

    </div>


    <!-- VUE -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- BOOTSTRAP -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <!-- COMPONENTS -->
    <script src="components/SearchBar.js"></script>
    <script src="components/Filters.js"></script>
    <script src="components/CardItem.js"></script>
    <script src="components/DeckItem.js"></script>
    <script src="components/ItemList.js"></script>
    <script src="components/CardDetails.js"></script>
    <script src="components/DeckDetails.js"></script>
    <script src="components/CardForm.js"></script>

    <!-- APP -->
    <script src="app.js"></script>

</body>

</html>
